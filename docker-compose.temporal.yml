# Slim local Temporal development stack (Postgres only, no Elasticsearch)
# Usage: docker compose -f docker-compose.temporal.yml up -d
# Web UI (temporal-ui service): http://localhost:8080
# gRPC endpoint: localhost:7233

services:
  temporal-postgresql:
    image: postgres:15-alpine
    container_name: temporal-postgresql
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-postgresql-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    networks:
      - temporal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal-server:
    image: temporalio/auto-setup:1.22.3
    container_name: temporal-server
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      # NOTE: the image only ships config/dynamicconfig/docker.yaml.
      # Pointing this at development-sql.yaml without mounting a
      # ./dynamicconfig volume crashes the server on startup
      # ("no such file or directory", exit 1).
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/docker.yaml
      - TEMPORAL_ADDRESS=temporal-server:7233
      - TEMPORAL_CLI_ADDRESS=temporal-server:7233
    ports:
      - "7233:7233"
    networks:
      - temporal-network
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal-server:7233 namespace list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.21.3
    container_name: temporal-ui
    depends_on:
      temporal-server:
        condition: service_started
    environment:
      - TEMPORAL_ADDRESS=temporal-server:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8080
    ports:
      - "8080:8080"
    networks:
      - temporal-network

  temporal-admin-tools:
    image: temporalio/admin-tools:1.22.3
    container_name: temporal-admin-tools
    depends_on:
      temporal-server:
        condition: service_started
    environment:
      - TEMPORAL_ADDRESS=temporal-server:7233
      - TEMPORAL_CLI_ADDRESS=temporal-server:7233
    networks:
      - temporal-network
    stdin_open: true
    tty: true

volumes:
  temporal-postgresql-data:

networks:
  temporal-network:
    driver: bridge
